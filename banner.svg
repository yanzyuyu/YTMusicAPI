<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240">
  <defs>
    <linearGradient id="bg_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12" />
      <stop offset="50%" stop-color="#0d111c" />
      <stop offset="100%" stop-color="#140a12" />
    </linearGradient>

    <linearGradient id="red_glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0033" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ff2a55" stop-opacity="0" />
    </linearGradient>

    <radialGradient id="mesh_left" cx="15%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#ff0033" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#ff0033" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="mesh_right" cx="85%" cy="80%" r="45%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="logo_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2a55" />
      <stop offset="50%" stop-color="#ff0033" />
      <stop offset="100%" stop-color="#c40026" />
    </linearGradient>

    <filter id="subtle_shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#ffffff" stroke-opacity="0.02" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="900" height="240" rx="16" fill="url(#bg_grad)" stroke="#21262d" stroke-width="1.2" />

  <!-- Grid Pattern Overlay -->
  <rect width="900" height="240" rx="16" fill="url(#grid)" />

  <!-- Ambient Glow Meshes -->
  <circle cx="120" cy="110" r="140" fill="url(#mesh_left)" />
  <circle cx="780" cy="180" r="160" fill="url(#mesh_right)" />

  <!-- Left Accent Emblem -->
  <g transform="translate(68, 62)">
    <!-- Outer Audio Wave Rings -->
    <circle cx="58" cy="58" r="54" fill="none" stroke="#ff0033" stroke-opacity="0.2" stroke-width="1.5" stroke-dasharray="4 4" />
    <circle cx="58" cy="58" r="44" fill="#161b26" stroke="#30363d" stroke-width="1.5" filter="url(#subtle_shadow)" />
    <!-- Gradient Inner Disc -->
    <circle cx="58" cy="58" r="34" fill="url(#logo_grad)" />
    <!-- Concentric Center Ring -->
    <circle cx="58" cy="58" r="22" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2" />
    <!-- Play Triangle -->
    <polygon points="53,46 69,58 53,70" fill="#ffffff" />
  </g>

  <!-- Title & Typography Hierarchy -->
  <g transform="translate(225, 88)">
    <!-- Main Title -->
    <text x="0" y="24" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="38" font-weight="800" letter-spacing="-0.03em">
      YTMusic<tspan fill="#ff2a55">API</tspan>
    </text>

    <!-- Subtitle Tagline -->
    <text x="0" y="55" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="14.5" font-weight="450" letter-spacing="-0.01em">
      Zero-dependency serverless YouTube Music engine with synced lyrics &amp; 302 edge streaming.
    </text>

    <!-- Architectural Micro-Tags -->
    <g transform="translate(0, 78)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="88" height="24" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1" />
      <text x="44" y="16" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, monospace" font-size="11" font-weight="600" text-anchor="middle">NODE 20+</text>

      <!-- Tag 2 -->
      <rect x="96" y="0" width="104" height="24" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1" />
      <text x="148" y="16" fill="#7ee787" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, monospace" font-size="11" font-weight="600" text-anchor="middle">0 RUNTIME DEPS</text>

      <!-- Tag 3 -->
      <rect x="208" y="0" width="112" height="24" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1" />
      <text x="264" y="16" fill="#79c0ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, monospace" font-size="11" font-weight="600" text-anchor="middle">302 REDIRECT</text>

      <!-- Tag 4 -->
      <rect x="328" y="0" width="118" height="24" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1" />
      <text x="387" y="16" fill="#d2a8ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, monospace" font-size="11" font-weight="600" text-anchor="middle">SYNCED LYRICS</text>

      <!-- Tag 5 -->
      <rect x="454" y="0" width="106" height="24" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1" />
      <text x="507" y="16" fill="#f2cc60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, monospace" font-size="11" font-weight="600" text-anchor="middle">VERCEL READY</text>
    </g>
  </g>
</svg>